<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — Vesha</title>
<style>
  :root{--bg:#0b0d0c;--text:#f1f2ec;--muted:#9ba39a;--accent:#c9f26b;--line:rgba(255,255,255,.09)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
    font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:2rem}
  main{max-width:44ch;text-align:center}
  .code{font:600 .78rem/1 ui-monospace,monospace;letter-spacing:.18em;color:var(--accent)}
  h1{font-size:clamp(2rem,7vw,3.4rem);letter-spacing:-.04em;margin:.9rem 0 .6rem}
  p{color:var(--muted);margin:0 0 1.8rem}
  a{display:inline-block;padding:.72rem 1.15rem;border-radius:10px;background:var(--accent);color:#0b0d0c;
    font-weight:600;text-decoration:none}
  a:hover{background:#d7ff7d}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <span class="code">404</span>
  <h1>Страница не нашлась</h1>
  <p>Возможно, проект переехал или ссылка устарела.</p>
  <a href="/">На главную</a>
</main>
</body>
</html>
