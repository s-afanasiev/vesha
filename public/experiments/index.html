<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Эксперименты — Vesha</title>
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem('vesha.theme') === 'sand' ? 'sand' : 'light';
    } catch (e) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .tile { position: relative; }
    .tile[data-visibility="admin"]::after {
      content: 'admin';
      position: absolute; top: 10px; right: 12px;
      font-size: 10px; letter-spacing: .06em; color: #b4632f;
      border: 1px solid currentColor; border-radius: 4px; padding: 1px 5px;
    }
    .tile__visibility {
      position: absolute; bottom: 10px; right: 12px;
      font: 11px/1.4 system-ui, sans-serif; cursor: pointer;
      border: 1px solid #c9c2b6; background: #fffdf8; color: #6b6558;
      border-radius: 5px; padding: 2px 8px;
    }
    .tile__visibility:hover { border-color: #b4632f; color: #b4632f; }
  </style>
</head>
<body class="page-experiments">
  <main class="experiments">
    <div class="experiments__nav">
      <a class="back-link" href="/">← Vesha</a>
      <div class="experiments__nav-end">
        <div data-vesha-theme-switcher></div>
        <div data-vesha-auth-widget></div>
      </div>
    </div>
    <header class="experiments__header">
      <h1>Эксперименты</h1>
      <p>Произвольные песочницы. Каждая плитка — отдельный проект.</p>
    </header>
    <div id="grid" class="tiles" aria-live="polite"></div>
    <p id="status" class="experiments__status" hidden></p>
  </main>
  <script src="/theme.js"></script>
  <script src="/auth.js"></script>
  <script>
    const grid = document.getElementById('grid');
    const statusEl = document.getElementById('status');

    function showStatus(message) {
      statusEl.hidden = false;
      statusEl.textContent = message;
    }

    let isAdmin = false;

    function renderTiles(experiments) {
      if (!experiments.length) {
        showStatus('Пока нет экспериментов.');
        return;
      }

      const frag = document.createDocumentFragment();

      for (const exp of experiments) {
        const tile = document.createElement('a');
        tile.className = 'tile';
        tile.href = exp.href;
        tile.dataset.status = exp.status || 'wip';
        if (exp.visibility === 'admin') tile.dataset.visibility = 'admin';

        const title = document.createElement('h2');
        title.className = 'tile__title';
        title.textContent = exp.title;

        const desc = document.createElement('p');
        desc.className = 'tile__desc';
        desc.textContent = exp.description || '';

        const meta = document.createElement('div');
        meta.className = 'tile__meta';

        const badge = document.createElement('span');
        badge.className = 'tile__status';
        badge.textContent = exp.status || 'wip';
        meta.appendChild(badge);

        if (Array.isArray(exp.tech) && exp.tech.length) {
          const tech = document.createElement('span');
          tech.className = 'tile__tech';
          tech.textContent = exp.tech.join(' · ');
          meta.appendChild(tech);
        }

        tile.append(title, desc, meta);

        // Админ: тумблер видимости плитки (all ↔ admin). Щелчок по нему не открывает плитку.
        if (isAdmin && !exp.adminLocked) {
          const toggle = document.createElement('button');
          toggle.className = 'tile__visibility';
          toggle.type = 'button';
          toggle.textContent = exp.visibility === 'admin' ? 'только админ' : 'всем';
          toggle.title = 'Переключить видимость плитки';
          toggle.addEventListener('click', async (e) => {
            e.preventDefault();
            e.stopPropagation();
            const next = exp.visibility === 'admin' ? 'all' : 'admin';
            try {
              const res = await fetch('/api/experiments/visibility', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ category: 'experiments', name: exp.id, visibility: next }),
              });
              const j = await res.json();
              if (!res.ok || j.error) throw new Error(j.error || res.status);
              exp.visibility = next;
              toggle.textContent = next === 'admin' ? 'только админ' : 'всем';
              tile.dataset.visibility = next;
            } catch (err) {
              showStatus('Не удалось переключить: ' + err.message);
            }
          });
          tile.appendChild(toggle);
        }

        frag.appendChild(tile);
      }

      grid.appendChild(frag);
    }

    // Каталог отдаёт сервер: registry × доступ из experiment_tiles (гость видит только 'all').
    fetch('/api/experiments')
      .then((res) => {
        if (!res.ok) throw new Error('catalog ' + res.status);
        return res.json();
      })
      .then((data) => {
        isAdmin = !!data.admin;
        renderTiles(Array.isArray(data.tiles) ? data.tiles : []);
      })
      .catch(() => {
        showStatus('Не удалось загрузить каталог экспериментов.');
      });
  </script>
</body>
</html>
